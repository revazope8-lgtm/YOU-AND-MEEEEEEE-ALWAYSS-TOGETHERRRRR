<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our First Year</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,500&family=Inter:wght@300;400&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #f5f2ed;
            --accent-tan: #d9d2c7;
            --text-dark: #4a443f;
            --soft-white: #ffffff;
            --tape-color: rgba(217, 210, 199, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 0;
        }

        /* Pinterest Grain Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            opacity: 0.4;
            pointer-events: none;
            z-index: 10;
        }

        header {
            z-index: 2;
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 2px;
            line-height: 1.3;
            margin: 0;
            text-transform: uppercase;
        }

        .emojis {
            display: block;
            font-size: 1.8rem;
            margin-top: 10px;
            letter-spacing: 8px;
        }

        .content-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            gap: 30px;
            padding: 20px;
        }

        .main-card {
            background-color: var(--soft-white);
            padding: 50px 40px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            max-width: 400px;
            z-index: 2;
            border: 1px solid rgba(0,0,0,0.02);
            text-align: center;
            animation: fadeIn 3s ease-in-out;
        }

        .main-card::before {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(-1deg);
            width: 90px;
            height: 30px;
            background: var(--tape-color);
            z-index: 3;
        }

        p {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-style: italic;
            line-height: 1.8;
            margin: 0;
        }

        .cat-gif {
            width: 140px;
            height: 140px;
            background: white;
            padding: 8px 8px 35px 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--accent-tan);
            flex-shrink: 0;
        }

        .cat-gif img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .left-cat { transform: rotate(-5deg); animation: float 6s ease-in-out infinite; }
        .right-cat { transform: rotate(5deg); animation: float 6s ease-in-out infinite reverse; }

        /* Sign-off Styling */
        .sign-off {
            margin-top: 30px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--text-dark);
            animation: fadeIn 4s ease-in-out;
        }

        .confetti-btn {
            margin-top: 40px;
            padding: 12px 30px;
            background-color: transparent;
            border: 1px solid var(--text-dark);
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 5;
        }

        .confetti-btn:hover {
            background-color: var(--text-dark);
            color: var(--soft-white);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(-3deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 800px) {
            .content-wrapper { flex-direction: column; gap: 20px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>HAPPY ONE YR ANIVERSARY<br>BABY BOY</h1>
        <div class="emojis">💋💗🫂</div>
    </header>

    <div class="content-wrapper">
        <div class="cat-gif left-cat">
            <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIyeXU0M3BicW00OHF6Z3R5amZpZ3R5Z3R5Z3R5Z3R5Z3R5Z3R5JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/K1T7mHnfzTzJ8A0X9G/giphy.gif" alt="cats">
        </div>

        <div class="main-card">
            <p>
                365 days later, and I'm still crazy for you. Thank you for every laugh, hug, and late-night call that made us stronger.
            </p>
        </div>

        <div class="cat-gif right-cat">
            <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIyeXU0M3BicW00OHF6Z3R5amZpZ3R5Z3R5Z3R5Z3R5Z3R5Z3R5JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/C9x0nrkuYlqjC/giphy.gif" alt="cats">
        </div>
    </div>

    <div class="sign-off">
        love u omieee 💋💋🐥
    </div>

    <button class="confetti-btn" onclick="celebrate()">Click for a surprise</button>

    <script>
        function celebrate() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#d9d2c7', '#4a443f', '#ffffff', '#ffccd5']
            });
        }
    </script>
</body>
</html>
